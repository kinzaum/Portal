<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAAOpen Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 id="title">Welcome to CAAOpen Portal</h1>
    <div class="beta-tag" id="beta">(Educational)</div>

    <div class="grid">
        <a href="https://aprendaingles.caaopen.org" class="card">
            <img src="Reading.png" alt="Learn English">
            <h3 data-key="pronunciation">Treine sua pronúncia (English Only)</h3>
        </a>
        <a href="https://cacapalavras.caaopen.org" class="card">
            <img src="cacapalavra.png" alt="Word Search">
            <h3 data-key="wordsearch">Word Search (English/Portuguese)</h3>
        </a>
        <a href="https://readingchallenge.caaopen.org" class="card">
            <img src="Snail.png" alt="Reading Challenge">
            <h3 data-key="reading">Reading Challenge (English)</h3>
        </a>
        <a href="https://math.caaopen.org/" class="card">
            <img src="logomath.png" alt="Basic Expressions">
            <h3 data-key="math">Math for Kids (English/Portuguese/Espanish/German/Japanese)</h3>
        </a>
        <a href="https://caaopen.org" class="card">
            <img src="Portal.png" alt="AAC Board Communication">
            <h3 data-key="aac">AAC BOARD Communication (19 Different Languages)</h3>
        </a>
        <a href="https://keyboard.caaopen.org" class="card">
            <img src="keyboards.png" alt="AAC KEYBOARD">
            <h3 data-key="keyboard">AAC KEYBOARD (English ONLY)</h3>
        </a>
    </div>

    <script src="script.js"></script>

</html>
